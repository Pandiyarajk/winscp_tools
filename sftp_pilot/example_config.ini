# SFTP Pilot configuration.
# Create config.ini from this with `sftp-pilot --init-config`, then fill in your server.
#
# Secrets can stay out of this file: the environment variables
# SFTP_PILOT_PASSWORD and SFTP_PILOT_KEY_PASSPHRASE override
# `password` and `private_key_passphrase` when set. Or keep them in the OS keyring:
# `pip install sftp-pilot[keyring]`, `sftp-pilot --store-password`, then add
# `password_store = keyring` below and remove the plain-text password.

[DEFAULT]
# Only sftp is supported.
protocol = sftp
host = example.com
port = 22
username = your_username
password =
# password_store = keyring
# Key authentication (RSA, ECDSA or Ed25519). Takes precedence when set.
# private_key_path = ~/.ssh/id_ed25519
# private_key_passphrase =

# Host key checking:
#   accept_new  remember a server on first connect, refuse it if its key later changes (default)
#   ask         show the fingerprint of a new server and trust it only if you say yes
#               (GUI and console; scheduled and --run-due runs cannot ask, so they refuse)
#   reject      only connect to servers already in known_hosts
#   auto_add    accept any key without checking (insecure: testing only)
host_key_policy = accept_new
known_hosts_file = known_hosts
# Seconds to wait for connect and authentication.
timeout = 30
# Upload to <name>.part and rename into place, so a failed upload never leaves
# a truncated file. Set false only for a server that forbids renames.
atomic_uploads = true

[PATHS]
# Defaults offered by the upload and download prompts.
remote_upload_dir = /remote/upload/path
local_download_dir = ./downloads

[SCHEDULING]
# false prevents the scheduler from being started.
enabled = true
# Seconds between checks for due tasks while the GUI or console is open.
# For unattended runs, schedule `sftp-pilot -c <this file> --run-due` instead.
check_interval = 30
# Extra attempts for a failed scheduled task, and the first delay in seconds
# (it doubles: 60, 120, 240).
retries = 3
retry_delay = 60

[LOGGING]
# Leave log_file empty to log to the console only.
log_file = sftp_pilot.log
log_level = INFO

# More servers: add one [server:<name>] section each, for example:
#
# [server:backup]
# host = backup.example.com
# port = 22
# username = your_username
# private_key_path = ~/.ssh/id_ed25519
#
# A named server never inherits the host, user or password from [DEFAULT], so
# one server's password can not be sent to another. It does share protocol,
# host_key_policy, known_hosts_file, timeout and atomic_uploads. Pick the server
# in the GUI or console; a scheduled task remembers its server. Environment
# passwords are per server: SFTP_PILOT_PASSWORD for [DEFAULT],
# SFTP_PILOT_PASSWORD_BACKUP for [server:backup].
