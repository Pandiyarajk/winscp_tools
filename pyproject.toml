# SFTP Pilot packaging
# Author: Pandiyaraj Karuppasamy
# Date: Oct-17-2026
# Modified: Oct-18-2026

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "sftp-pilot"
dynamic = ["version"]
description = "SFTP file transfer manager with a GUI, a console menu and a persistent task scheduler"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Pandiyaraj Karuppasamy" }]
keywords = ["sftp", "file-transfer", "scheduler", "automation", "paramiko"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: System Administrators",
    "Intended Audience :: Developers",
    "Environment :: Console",
    "Environment :: X11 Applications",
    "Environment :: Win32 (MS Windows)",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Networking",
    "Topic :: System :: Systems Administration",
]
dependencies = ["paramiko>=3.4"]

[project.optional-dependencies]
keyring = ["keyring>=24"]
dev = ["pytest>=8", "asyncssh>=2.14", "keyring>=24"]

[project.scripts]
sftp-pilot = "sftp_pilot.cli:main"

[project.urls]
Homepage = "https://github.com/Pandiyarajk/sftp-pilot"
Issues = "https://github.com/Pandiyarajk/sftp-pilot/issues"
Changelog = "https://github.com/Pandiyarajk/sftp-pilot/blob/main/CHANGE_LOG.md"

[tool.setuptools]
packages = ["sftp_pilot"]

[tool.setuptools.package-data]
sftp_pilot = ["example_config.ini"]

[tool.setuptools.dynamic]
version = { attr = "sftp_pilot.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
